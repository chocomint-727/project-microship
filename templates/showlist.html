
<html>
    <head>
        <title>Media Sorter</title>
        <style> 
            @keyframes grow_on_hover{
                from {
                    transform: scale(1);
                    background-color: rgb(125,125,155);
                }
                to {
                    transform: scale(1.1);
                    background-color: rgb(155,155,175);
                }
            }
            @keyframes shrink_on_hover{
                from {
                    transform: scale(1.1);
                    background-color: rgb(155,155,175);
                }
                to {
                    transform: scale(1);
                    background-color: rgb(125,125,155);
                }
            }
            tr {
                cursor: pointer;
                border: 1px solid black;
                animation-name: shrink_on_hover;
                animation-duration: .1s;
                animation-timing-function: ease-in-out;
                animation-fill-mode: forwards;
                height: auto;
            }
            tr:hover {
                animation-duration: .1s;
                animation-name: grow_on_hover;
                animation-timing-function: ease-in-out;
                animation-fill-mode: forwards;
            }
            table {
                border-spacing: 0px 10px;
                border-collapse: separate;
                width: 85%;
                margin-left: auto;
                margin-right: auto;
            }
            td {
                padding: 15px;
                text-align: center;
                border-top: 1px solid black;
                border-bottom: 1px solid black;
            }
            td:first-child {
                border-top-left-radius: 10px;
                border-bottom-left-radius: 10px;
                border-top: 1px solid black;
                border-left: 1px solid black;
                border-bottom: 1px solid black;
            }
            td:last-child {
                border-top-right-radius: 10px;
                border-bottom-right-radius: 10px;
                border-top: 1px solid black;
                border-right: 1px solid black;
                border-bottom: 1px solid black;
            }
            html {
                font-family: "Lexend Deca";
                background-color: rgb(75,75,75);
                color: white;
            }
        </style>
    <!""" + {{ids}}+ """>
    </head>
    <body>
        <h1>Filtered TV Shows</h1><br>
        <table cellspacing=0>
            {% for ix in indices %}
            <tr> {% for data in ix %}
                <td>{{ data }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </table>
    </body>
</html>
